
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flow Dream X • Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-deep: #0a0a14;
            --bg-surface: #0d0e18;
            --bg-elevated: #13152a;
            --glass-bg: rgba(18, 20, 35, 0.75);
            --glass-stroke: rgba(168, 85, 247, 0.3);
            --purple-primary: #a855f7;
            --purple-glow: #c084fc;
            --teal-mystic: #2dd4bf;
            --text-light: #f3f0ff;
            --text-secondary: #c4c1d6;
            --text-dim: #8b86a3;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0a0a14 0%, #130b1e 50%, #0a0a14 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            pointer-events: none;
        }
        .orb-1 { width: 300px; height: 300px; background: #a855f7; top: -100px; left: -100px; animation: floatOrb 20s infinite; }
        .orb-2 { width: 400px; height: 400px; background: #2dd4bf; bottom: -150px; right: -150px; animation: floatOrb 25s infinite reverse; }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        .dashboard-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: var(--bg-surface);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            border: 1px solid var(--glass-stroke);
            z-index: 10;
        }

        @media (min-width: 768px) {
            .dashboard-wrapper {
                height: 90vh;
                border-radius: 48px;
                margin: 20px auto;
            }
        }

        .main-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .main-scroll::-webkit-scrollbar-track {
            background: rgba(168,85,247,0.1);
            border-radius: 10px;
        }
        .main-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #a855f7, #2dd4bf);
            border-radius: 10px;
        }

        .header {
            padding: 16px 20px;
            background: rgba(13, 14, 24, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-stroke);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: rgba(168,85,247,0.2);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            color: var(--purple-glow);
            font-size: 1.2rem;
            cursor: pointer;
        }
        .back-btn:active { transform: scale(0.95); }

        .header-title {
            flex: 1;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            background: var(--bg-elevated);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-stroke);
            color: var(--purple-glow);
            font-size: 1.1rem;
            cursor: pointer;
            position: relative;
        }
        .icon-btn:active { transform: scale(0.94); }

        .inbox-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            display: none;
        }

        .main-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 90px;
        }

        /* Hero Video */
        .hero-video {
            width: 100%;
            border-radius: 24px;
            margin-bottom: 16px;
            overflow: hidden;
            position: relative;
        }
        .hero-video video {
            width: 100%;
            height: auto;
            display: block;
        }
        .hero-caption {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.65rem;
            color: white;
        }

        /* Stats Row */
        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            flex: 1;
            background: rgba(168,85,247,0.1);
            border-radius: 16px;
            padding: 10px;
            text-align: center;
            border: 1px solid var(--glass-stroke);
        }
        .stat-card i {
            font-size: 1.2rem;
            color: var(--teal-mystic);
            margin-bottom: 4px;
        }
        .stat-card .value {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-light);
        }
        .stat-card .label {
            font-size: 0.55rem;
            color: var(--text-dim);
        }

        /* Carousel */
        .carousel-section {
            margin: 16px 0;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }
        .section-header h3 {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--purple-glow);
        }
        .carousel-container {
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            display: flex;
            gap: 12px;
            padding: 4px 2px 8px;
            scroll-behavior: smooth;
        }
        .carousel-item {
            flex: 0 0 40%;
            scroll-snap-align: start;
            background: linear-gradient(135deg, var(--bg-elevated), var(--bg-surface));
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--glass-stroke);
            transition: all 0.3s;
            cursor: pointer;
        }
        .carousel-item:active {
            transform: scale(0.98);
        }
        .carousel-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-size: cover;
            background-position: center;
            background-color: #1a1a2e;
        }
        .carousel-caption {
            padding: 6px;
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.5);
        }

        /* Grid Menu */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 16px 0;
        }
        .grid-item {
            background: linear-gradient(135deg, var(--bg-elevated), var(--bg-surface));
            border-radius: 16px;
            padding: 12px 6px;
            text-align: center;
            transition: all 0.3s;
            border: 1px solid var(--glass-stroke);
            cursor: pointer;
        }
        .grid-item:active {
            transform: scale(0.96);
        }
        .grid-item i {
            font-size: 1.3rem;
            color: var(--teal-mystic);
            margin-bottom: 6px;
        }
        .grid-item span {
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Inbox Modal */
        .inbox-modal {
            position: fixed;
            bottom: 90px;
            right: 16px;
            width: 300px;
            background: linear-gradient(135deg, var(--bg-elevated), var(--bg-surface));
            border-radius: 20px;
            border: 1px solid var(--purple-primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 200;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }
        .inbox-modal.open {
            transform: translateX(0);
        }
        .inbox-header {
            padding: 12px 16px;
            background: rgba(168,85,247,0.2);
            border-bottom: 1px solid var(--glass-stroke);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .inbox-header h4 {
            font-size: 0.85rem;
            color: var(--purple-glow);
        }
        .inbox-body {
            padding: 12px;
            max-height: 350px;
            overflow-y: auto;
        }
        .inbox-message {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 0.7rem;
        }
        .inbox-message .sender {
            color: var(--teal-mystic);
            font-weight: 600;
            margin-bottom: 4px;
        }
        .inbox-message .msg-text {
            color: var(--text-secondary);
        }
        .inbox-message .time {
            font-size: 0.55rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            flex-shrink: 0;
            background: rgba(13, 14, 24, 0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-stroke);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px;
            z-index: 30;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            border-radius: 30px;
            transition: all 0.2s;
            cursor: pointer;
            color: var(--text-dim);
            background: transparent;
            border: none;
            font-family: inherit;
        }
        .nav-item i { font-size: 1.1rem; }
        .nav-item span { font-size: 0.55rem; font-weight: 500; }
        .nav-item.active {
            background: rgba(168,85,247,0.2);
            color: var(--purple-glow);
        }
        .nav-item:active { transform: scale(0.95); }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(10,10,20,0.95);
            border: 1px solid var(--teal-mystic);
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            font-size: 0.75rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 150;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="dashboard-wrapper">
        <div class="header">
            <div class="header-title"><i class="fas fa-home"></i> Dashboard</div>
            <div class="header-actions">
                <div class="icon-btn" id="inboxBtn">
                    <i class="fas fa-envelope"></i>
                    <span class="inbox-badge" id="inboxBadge">0</span>
                </div>
                <div class="icon-btn" id="menuToggleBtn">
                    <i class="fas fa-bars-staggered"></i>
                </div>
            </div>
        </div>

        <div class="main-scroll">
            <div class="hero-video">
                <video id="heroVideo" autoplay muted loop playsinline>
                    <source src="video.mp4" type="video/mp4">
                </video>
                <div class="hero-caption"><i class="fas fa-play"></i> Flow Dream X Dashboard</div>
            </div>

            <div class="stats-row">
                <div class="stat-card"><i class="fas fa-map-marker-alt"></i><div class="value" id="locationDisplay">--</div><div class="label">Lokasi</div></div>
                <div class="stat-card"><i class="fas fa-battery-full"></i><div class="value" id="batteryDisplay">--%</div><div class="label">Baterai</div></div>
                <div class="stat-card"><i class="fas fa-signal"></i><div class="value" id="signalDisplay">5G</div><div class="label">Sinyal</div></div>
            </div>

            <div class="carousel-section">
                <div class="section-header"><h3><i class="fas fa-users"></i> SOCIAL DREAM</h3><span style="font-size:0.55rem;">geser →</span></div>
                <div class="carousel-container">
                    <div class="carousel-item"><div class="carousel-img" style="background-image: url('slide1.png');"></div><div class="carousel-caption">Dream Community</div></div>
                    <div class="carousel-item"><div class="carousel-img" style="background-image: url('slide2.png');"></div><div class="carousel-caption">Creative Hub</div></div>
                    <div class="carousel-item"><div class="carousel-img" style="background-image: url('slide3.png');"></div><div class="carousel-caption">Digital Art</div></div>
                </div>
            </div>

            <div class="grid-menu">
                <div class="grid-item" data-page="tiktok"><i class="fab fa-tiktok"></i><span>TikTok</span></div>
                <div class="grid-item" data-page="create"><i class="fas fa-magic"></i><span>Create SC</span></div>
                <div class="grid-item" data-page="anime"><i class="fas fa-dragon"></i><span>Anime</span></div>
            </div>

            <div class="section-header"><h3><i class="fas fa-bolt"></i> AKSES CEPAT</h3></div>
            <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;">
                <div class="grid-item" data-page="music" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;"><div><i class="fas fa-music"></i> <span>Music Player</span></div><i class="fas fa-chevron-right" style="font-size: 0.7rem;"></i></div>
                <div class="grid-item" data-page="store" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;"><div><i class="fas fa-store"></i> <span>Store</span></div><i class="fas fa-chevron-right" style="font-size: 0.7rem;"></i></div>
                <div class="grid-item" data-page="suntik" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;"><div><i class="fas fa-syringe"></i> <span>Suntik Sosmed</span></div><i class="fas fa-chevron-right" style="font-size: 0.7rem;"></i></div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-item active" data-page="home"><i class="fas fa-home"></i><span>Home</span></button>
            <button class="nav-item" data-page="store"><i class="fas fa-store"></i><span>Store</span></button>
            <button class="nav-item" data-page="create"><i class="fas fa-magic"></i><span>Create</span></button>
            <button class="nav-item" data-page="other"><i class="fas fa-clock"></i><span>Other</span></button>
            <button class="nav-item" data-page="music"><i class="fas fa-music"></i><span>Music</span></button>
            <button class="nav-item" data-page="tiktok"><i class="fab fa-tiktok"></i><span>TikTok</span></button>
            <button class="nav-item" data-page="suntik"><i class="fas fa-syringe"></i><span>Suntik</span></button>
            <button class="nav-item" data-page="profile"><i class="fas fa-user"></i><span>Profile</span></button>
        </div>
    </div>

    <!-- Inbox Modal -->
    <div class="inbox-modal" id="inboxModal">
        <div class="inbox-header">
            <h4><i class="fas fa-inbox"></i> Pesan Masuk</h4>
            <i class="fas fa-times" id="closeInbox" style="cursor:pointer;"></i>
        </div>
        <div class="inbox-body" id="inboxList">
            <div style="text-align:center; color:var(--text-dim);">Tidak ada pesan</div>
        </div>
    </div>

    <div class="toast" id="toastMsg">Pesan</div>

    <script>
        // Check session
        const session = JSON.parse(localStorage.getItem('flowdream_session'));
        if(!session) {
            window.location.href = 'index.html';
        }

        // Load database
        let db = JSON.parse(localStorage.getItem('flowdream_db'));
        let user = db.users.find(u => u.id === session.userId);

        function showToast(msg) {
            const toast = document.getElementById('toastMsg');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Get real location
        function getRealLocation() {
            const locationEl = document.getElementById('locationDisplay');
            if('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        try {
                            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${position.coords.latitude}&lon=${position.coords.longitude}&zoom=18`);
                            const data = await res.json();
                            const city = data.address?.city || data.address?.town || data.address?.village || 'Unknown';
                            if(locationEl) locationEl.innerText = city;
                        } catch(e) { if(locationEl) locationEl.innerText = 'Local'; }
                    },
                    () => { if(locationEl) locationEl.innerText = 'Unknown'; }
                );
            } else { if(locationEl) locationEl.innerText = 'Not supported'; }
        }
        getRealLocation();

        // Get battery
        function getBattery() {
            const batteryEl = document.getElementById('batteryDisplay');
            if('getBattery' in navigator) {
                navigator.getBattery().then(batt => { if(batteryEl) batteryEl.innerText = Math.floor(batt.level * 100) + '%'; });
            } else { if(batteryEl) batteryEl.innerText = '87%'; }
        }
        getBattery();
        setInterval(getBattery, 60000);

        // Get signal
        function getSignal() {
            const signals = ['5G+', '5G', 'LTE+', 'LTE'];
            const signalEl = document.getElementById('signalDisplay');
            if(signalEl) signalEl.innerText = signals[Math.floor(Math.random() * signals.length)];
        }
        getSignal();
        setInterval(getSignal, 30000);

        // Load inbox - PERBAIKAN UTAMA
        function loadInbox() {
            const inboxList = document.getElementById('inboxList');
            const inboxBadge = document.getElementById('inboxBadge');
            if(!inboxList) return;
            
            const readBy = JSON.parse(localStorage.getItem('read_messages') || '[]');
            const now = new Date();
            
            // Filter inbox yang belum expired
            const userInbox = (db.inbox || []).filter(msg => {
                const expired = new Date(msg.expired_at);
                return (msg.to_role === 'all' || msg.to_role === session.role) && expired > now;
            });
            
            const unreadCount = userInbox.filter(msg => !readBy.includes(msg.id)).length;
            
            if(inboxBadge) {
                if(unreadCount > 0) {
                    inboxBadge.style.display = 'flex';
                    inboxBadge.innerText = unreadCount > 99 ? '99+' : unreadCount;
                    
                    // Show notification
                    if(Notification.permission === 'granted') {
                        new Notification('Flow Dream X', { 
                            body: `${unreadCount} pesan baru!`, 
                            icon: 'logo.png' 
                        });
                    }
                } else {
                    inboxBadge.style.display = 'none';
                }
            }

            if(userInbox.length === 0) {
                inboxList.innerHTML = '<div style="text-align:center; color:var(--text-dim); padding:20px;">📭 Tidak ada pesan</div>';
                return;
            }

            inboxList.innerHTML = userInbox.map(msg => `
                <div class="inbox-message" data-msg-id="${msg.id}">
                    <div class="sender"><i class="fas fa-user"></i> ${msg.from}</div>
                    <div class="msg-text">${msg.message}</div>
                    <div class="time">${msg.created_at}</div>
                </div>
            `).join('');
            
            // Mark as read
            const newReadBy = [...readBy, ...userInbox.map(msg => msg.id)];
            localStorage.setItem('read_messages', JSON.stringify([...new Set(newReadBy)]));
        }
        
        loadInbox();
        
        // Auto refresh inbox every 30 seconds
        setInterval(() => {
            db = JSON.parse(localStorage.getItem('flowdream_db'));
            loadInbox();
        }, 30000);

        // Inbox modal toggle
        const inboxModal = document.getElementById('inboxModal');
        const inboxBtn = document.getElementById('inboxBtn');
        const closeInbox = document.getElementById('closeInbox');
        
        if(inboxBtn) {
            inboxBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                inboxModal.classList.toggle('open');
                // Refresh inbox when opened
                loadInbox();
            });
        }
        
        if(closeInbox) {
            closeInbox.addEventListener('click', () => {
                inboxModal.classList.remove('open');
            });
        }
        
        // Close modal when clicking outside
        document.addEventListener('click', (e) => {
            if(inboxModal && inboxModal.classList.contains('open')) {
                if(!inboxModal.contains(e.target) && !inboxBtn.contains(e.target)) {
                    inboxModal.classList.remove('open');
                }
            }
        });

        // Navigation function
        const pageMap = {
            'home': 'home.html',
            'store': 'store.html',
            'create': 'create.html',
            'music': 'music.html',
            'tiktok': 'tiktok.html',
            'suntik': 'suntik.html',
            'profile': 'profile.html'
        };

        function navigateTo(page) {
            if(page === 'other') {
                showToast('🚀 Coming Soon!');
                return;
            }
            if(page === 'anime') {
                showToast('🎬 Anime feature coming soon!');
                return;
            }
            if(pageMap[page]) {
                window.location.href = pageMap[page];
            }
        }

        // Bottom nav buttons
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const page = btn.getAttribute('data-page');
                navigateTo(page);
            });
        });

        // Grid items navigation
        document.querySelectorAll('.grid-item[data-page]').forEach(item => {
            item.addEventListener('click', () => {
                const page = item.getAttribute('data-page');
                navigateTo(page);
            });
        });

        // Sidebar injection
        const sidebarHTML = `
            <div class="sidebar-overlay" id="sidebarOverlay"></div>
            <aside class="sidebar" id="sidebarPanel">
                <div class="sidebar-banner">
                    <video autoplay muted loop playsinline><source src="banner.mp4" type="video/mp4"></video>
                    <div class="sidebar-logo"><i class="fas fa-dragon"></i></div>
                </div>
                <div class="sidebar-menu">
                    <div class="sidebar-item" data-side="reseller"><i class="fas fa-chart-line"></i> Reseller Page</div>
                    <div class="sidebar-item" data-side="dev"><i class="fas fa-code"></i> Dev Page</div>
                </div>
                <div style="padding: 16px; font-size:0.6rem; color:var(--text-dim); border-top:1px solid var(--glass-stroke);">
                    <i class="fas fa-crown"></i> Flow Dream X v3.0
                </div>
            </aside>
            <style>
                .sidebar-overlay {
                    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
                    z-index: 90; opacity: 0; visibility: hidden; transition: 0.3s;
                }
                .sidebar {
                    position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
                    background: linear-gradient(135deg, var(--bg-surface), #0a0a14);
                    border-right: 2px solid var(--purple-primary);
                    z-index: 100; transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
                    display: flex; flex-direction: column;
                }
                .sidebar.open { left: 0; }
                .sidebar-banner { height: 140px; position: relative; overflow: hidden; }
                .sidebar-banner video { width: 100%; height: 100%; object-fit: cover; }
                .sidebar-logo {
                    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                    width: 60px; height: 60px; background: linear-gradient(135deg, #a855f7, #2dd4bf);
                    border-radius: 50%; display: flex; align-items: center; justify-content: center;
                    border: 2px solid white;
                }
                .sidebar-logo i { font-size: 1.8rem; color: white; }
                .sidebar-menu { padding: 20px; flex: 1; }
                .sidebar-item {
                    display: flex; align-items: center; gap: 14px; padding: 12px 16px;
                    border-radius: 20px; color: var(--text-secondary); text-decoration: none;
                    margin: 8px 0; transition: all 0.3s; cursor: pointer;
                }
                .sidebar-item:hover { background: rgba(168,85,247,0.2); color: var(--purple-glow); transform: translateX(6px); }
                .sidebar-item i { width: 24px; }
            </style>
        `;
        document.body.insertAdjacentHTML('beforeend', sidebarHTML);

        const sidebarPanel = document.getElementById('sidebarPanel');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const menuToggleBtn = document.getElementById('menuToggleBtn');

        function closeSidebar() {
            if(sidebarPanel) sidebarPanel.classList.remove('open');
            if(sidebarOverlay) { sidebarOverlay.style.opacity = '0'; sidebarOverlay.style.visibility = 'hidden'; }
        }
        
        function openSidebar() {
            if(sidebarPanel) sidebarPanel.classList.add('open');
            if(sidebarOverlay) { sidebarOverlay.style.opacity = '1'; sidebarOverlay.style.visibility = 'visible'; }
        }
        
        if(menuToggleBtn) menuToggleBtn.addEventListener('click', (e) => { e.stopPropagation(); openSidebar(); });
        if(sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
        
        document.querySelectorAll('.sidebar-item').forEach(item => {
            item.addEventListener('click', () => {
                const side = item.getAttribute('data-side');
                if(side === 'reseller') window.location.href = 'ress.html';
                if(side === 'dev') window.location.href = 'dev.html';
                closeSidebar();
            });
        });
        
        document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeSidebar(); });
    </script>
</body>
</html>
