<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flow Dream X • Reseller Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-deep: #0a0a14; --bg-surface: #0d0e18; --bg-elevated: #13152a;
            --glass-stroke: rgba(168,85,247,0.3); --purple-primary: #a855f7;
            --purple-glow: #c084fc; --teal-mystic: #2dd4bf;
            --text-light: #f3f0ff; --text-secondary: #c4c1d6; --text-dim: #8b86a3;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0a0a14 0%, #130b1e 50%, #0a0a14 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
        }
        .orb { position: fixed; border-radius: 50%; filter: blur(60px); opacity: 0.4; pointer-events: none; }
        .orb-1 { width: 300px; height: 300px; background: #a855f7; top: -100px; left: -100px; animation: floatOrb 20s infinite; }
        .orb-2 { width: 400px; height: 400px; background: #2dd4bf; bottom: -150px; right: -150px; animation: floatOrb 25s infinite reverse; }
        @keyframes floatOrb { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,30px); } }
        .dashboard-wrapper {
            position: relative; width: 100%; max-width: 500px; height: 100vh;
            background: var(--bg-surface); overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.5); border: 1px solid var(--glass-stroke); z-index: 10;
        }
        @media (min-width: 768px) { .dashboard-wrapper { height: 90vh; border-radius: 48px; margin: 20px auto; } }
        .main-scroll::-webkit-scrollbar { width: 5px; }
        .main-scroll::-webkit-scrollbar-track { background: rgba(168,85,247,0.1); border-radius: 10px; }
        .main-scroll::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #a855f7, #2dd4bf); border-radius: 10px; }
        .header {
            padding: 16px 20px; background: rgba(13,14,24,0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-stroke); display: flex; align-items: center; gap: 16px; flex-shrink: 0;
        }
        .back-btn { width: 40px; height: 40px; background: rgba(168,85,247,0.2); border-radius: 30px; display: flex; align-items: center; justify-content: center; border: none; color: var(--purple-glow); font-size: 1.2rem; cursor: pointer; }
        .back-btn:active { transform: scale(0.95); }
        .header-title { flex: 1; font-size: 1.2rem; font-weight: 700; background: linear-gradient(135deg, #fff, #c084fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .header-actions { display: flex; gap: 12px; }
        .icon-btn { width: 40px; height: 40px; background: var(--bg-elevated); border-radius: 30px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--glass-stroke); color: var(--purple-glow); font-size: 1.1rem; cursor: pointer; position: relative; }
        .icon-btn:active { transform: scale(0.94); }
        .main-scroll { flex: 1; overflow-y: auto; padding: 16px 20px 90px; }
        .glass-card { background: rgba(30,30,45,0.6); backdrop-filter: blur(10px); border-radius: 24px; padding: 20px; border: 1px solid var(--glass-stroke); margin-bottom: 20px; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 0.7rem; color: var(--purple-glow); margin-bottom: 6px; }
        .input-group input, .input-group select { width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-stroke); border-radius: 20px; color: var(--text-light); font-size: 0.85rem; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--purple-primary), var(--teal-mystic)); border: none; border-radius: 30px; color: white; font-weight: 700; cursor: pointer; margin-top: 12px; }
        .btn:active { transform: scale(0.98); }
        .btn-danger { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #fca5a5; }
        .user-card { background: rgba(30,30,45,0.4); border-radius: 20px; padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--glass-stroke); }
        .user-info { flex: 1; }
        .user-name { font-weight: 700; font-size: 0.85rem; color: var(--text-light); }
        .user-role { font-size: 0.65rem; color: var(--teal-mystic); }
        .user-expired { font-size: 0.6rem; color: var(--text-dim); }
        .user-actions { display: flex; gap: 8px; }
        .user-actions button { background: rgba(168,85,247,0.2); border: none; padding: 6px 12px; border-radius: 20px; color: var(--purple-glow); font-size: 0.65rem; cursor: pointer; }
        .bottom-nav {
            flex-shrink: 0; background: rgba(13,14,24,0.98); backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-stroke); display: flex; justify-content: space-around;
            align-items: center; padding: 8px 12px; z-index: 30;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 6px 10px; border-radius: 30px; transition: all 0.2s;
            cursor: pointer; color: var(--text-dim); background: transparent; border: none; font-family: inherit;
        }
        .nav-item i { font-size: 1.1rem; }
        .nav-item span { font-size: 0.55rem; font-weight: 500; }
        .nav-item.active { background: rgba(168,85,247,0.2); color: var(--purple-glow); }
        .toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: rgba(10,10,20,0.95); border: 1px solid var(--teal-mystic);
            padding: 8px 16px; border-radius: 30px; color: white; font-size: 0.75rem;
            opacity: 0; visibility: hidden; transition: all 0.3s; z-index: 150; white-space: nowrap;
        }
        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="dashboard-wrapper">
        <div class="header">
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
            <div class="header-title"><i class="fas fa-chart-line"></i> Reseller Page</div>
            <div class="header-actions"><div class="icon-btn" id="menuToggleBtn"><i class="fas fa-bars-staggered"></i></div></div>
        </div>

        <div class="main-scroll">
            <div class="glass-card">
                <h4 style="margin-bottom:16px; color:var(--purple-glow);"><i class="fas fa-user-plus"></i> Create Account</h4>
                <div class="input-group"><label>Username</label><input type="text" id="newUsername" placeholder="Username baru"></div>
                <div class="input-group"><label>Password</label><input type="text" id="newPassword" placeholder="Password"></div>
                <div class="input-group"><label>Durasi</label><select id="duration"><option value="30">30 Days</option><option value="permanen">Permanen</option></select></div>
                <button class="btn" id="createUserBtn"><i class="fas fa-plus"></i> Create Account</button>
            </div>

            <div class="glass-card">
                <h4 style="margin-bottom:16px; color:var(--purple-glow);"><i class="fas fa-users"></i> My Created Accounts</h4>
                <div id="userList"></div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-item" data-page="home"><i class="fas fa-home"></i><span>Home</span></button>
            <button class="nav-item" data-page="store"><i class="fas fa-store"></i><span>Store</span></button>
            <button class="nav-item" data-page="create"><i class="fas fa-magic"></i><span>Create</span></button>
            <button class="nav-item" data-page="other"><i class="fas fa-clock"></i><span>Other</span></button>
            <button class="nav-item" data-page="music"><i class="fas fa-music"></i><span>Music</span></button>
            <button class="nav-item" data-page="tiktok"><i class="fab fa-tiktok"></i><span>TikTok</span></button>
            <button class="nav-item" data-page="suntik"><i class="fas fa-syringe"></i><span>Suntik</span></button>
            <button class="nav-item" data-page="profile"><i class="fas fa-user"></i><span>Profile</span></button>
        </div>
    </div>

    <div class="toast" id="toastMsg">Pesan</div>

    <script>
        const session = JSON.parse(localStorage.getItem('flowdream_session'));
        if(!session) window.location.href = 'index.html';

        let db = JSON.parse(localStorage.getItem('flowdream_db'));
        let user = db.users.find(u => u.id === session.userId);

        const allowedRoles = ['resseller', 'partner', 'tk', 'mods', 'owner', 'developer'];
        if(!allowedRoles.includes(user.role)) { showToast('Akses ditolak! Hanya Reseller ke atas.'); setTimeout(() => window.location.href='home.html', 2000); }

        function showToast(msg) { const toast = document.getElementById('toastMsg'); toast.innerText = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); }

        function saveDB() { localStorage.setItem('flowdream_db', JSON.stringify(db)); }

        function renderUserList() {
            const createdUsers = db.users.filter(u => u.created_by === user.username);
            const container = document.getElementById('userList');
            if(createdUsers.length === 0) { container.innerHTML = '<div style="text-align:center; color:var(--text-dim);">Belum ada akun yang dibuat</div>'; return; }
            container.innerHTML = createdUsers.map(u => `
                <div class="user-card">
                    <div class="user-info">
                        <div class="user-name">${u.username}</div>
                        <div class="user-role">${u.role}</div>
                        <div class="user-expired">Expired: ${u.expired_at || 'Permanen'}</div>
                    </div>
                    <div class="user-actions">
                        <button onclick="copyCredentials('${u.username}','${u.password}')"><i class="fas fa-copy"></i></button>
                        <button onclick="deleteUser('${u.username}')" style="color:#f87171;"><i class="fas fa-trash"></i></button>
                        <button onclick="extendUser('${u.username}')"><i class="fas fa-calendar-plus"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function copyCredentials(username, password) { navigator.clipboard.writeText(`Username: ${username}\nPassword: ${password}`); showToast('Credentials copied!'); }

        function deleteUser(username) {
            if(confirm(`Hapus user ${username}?`)) {
                db.users = db.users.filter(u => u.username !== username);
                saveDB();
                renderUserList();
                showToast(`User ${username} dihapus`);
                db.inbox.push({ id: 'msg_'+Date.now(), to_role: 'all', from: user.username, message: `🗑️ ${user.username} menghapus user: ${username}`, created_at: new Date().toLocaleString(), expired_at: new Date(Date.now()+48*60*60*1000).toLocaleString(), read_by: [] });
                saveDB();
            }
        }

        function extendUser(username) { showToast('Fitur extend sedang dalam pengembangan'); }

        document.getElementById('createUserBtn').addEventListener('click', () => {
            let newUsername = document.getElementById('newUsername').value.trim();
            let newPassword = document.getElementById('newPassword').value.trim();
            let duration = document.getElementById('duration').value;
            if(!newUsername || !newPassword) { showToast('Isi username dan password!'); return; }
            if(db.users.find(u => u.username === newUsername)) { showToast('Username sudah ada!'); return; }
            let expired_at = duration === 'permanen' ? null : new Date(Date.now() + duration*24*60*60*1000).toISOString();
            let newUser = { id: 'user_'+Date.now(), username: newUsername, password: newPassword, role: 'member', fullname: newUsername, session_key: 'sess_'+Math.random().toString(36).substr(2,8), active_device: null, created_at: new Date().toISOString(), expired_at: expired_at, created_by: user.username };
            db.users.push(newUser);
            saveDB();
            renderUserList();
            showToast(`User ${newUsername} berhasil dibuat!`);
            db.inbox.push({ id: 'msg_'+Date.now(), to_role: 'all', from: user.username, message: `✨ ${user.username} membuat user baru: ${newUsername} (${duration === 'permanen' ? 'Permanen' : duration+' days'})`, created_at: new Date().toLocaleString(), expired_at: new Date(Date.now()+48*60*60*1000).toLocaleString(), read_by: [] });
            saveDB();
            document.getElementById('newUsername').value = ''; document.getElementById('newPassword').value = '';
        });

        function goBack() { window.location.href = 'home.html'; }
        const pageMap = { 'home':'home.html','store':'store.html','create':'create.html','music':'music.html','tiktok':'tiktok.html','suntik':'suntik.html','profile':'profile.html' };
        document.querySelectorAll('.nav-item').forEach(btn => { btn.addEventListener('click', () => { const page = btn.getAttribute('data-page'); if(page === 'other') { showToast('Coming Soon!'); return; } if(pageMap[page]) window.location.href = pageMap[page]; }); });
        renderUserList();

        // Sidebar injection (sama seperti sebelumnya)
        const sidebarHTML = `<div class="sidebar-overlay" id="sidebarOverlay"></div><aside class="sidebar" id="sidebarPanel"><div class="sidebar-banner"><video autoplay muted loop playsinline><source src="banner.mp4" type="video/mp4"></video><div class="sidebar-logo"><i class="fas fa-dragon"></i></div></div><div class="sidebar-menu"><div class="sidebar-item" data-side="reseller"><i class="fas fa-chart-line"></i> Reseller Page</div><div class="sidebar-item" data-side="dev"><i class="fas fa-code"></i> Dev Page</div></div><div style="padding: 16px; font-size:0.6rem; color:var(--text-dim); border-top:1px solid var(--glass-stroke);"><i class="fas fa-crown"></i> Flow Dream X v3.0</div></aside><style>.sidebar-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:90;opacity:0;visibility:hidden;transition:.3s}.sidebar{position:fixed;top:0;left:-280px;width:280px;height:100%;background:linear-gradient(135deg,var(--bg-surface),#0a0a14);border-right:2px solid var(--purple-primary);z-index:100;transition:left .35s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column}.sidebar.open{left:0}.sidebar-banner{height:140px;position:relative;overflow:hidden}.sidebar-banner video{width:100%;height:100%;object-fit:cover}.sidebar-logo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;background:linear-gradient(135deg,#a855f7,#2dd4bf);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white}.sidebar-logo i{font-size:1.8rem;color:white}.sidebar-menu{padding:20px;flex:1}.sidebar-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:20px;color:var(--text-secondary);text-decoration:none;margin:8px 0;transition:.3s;cursor:pointer}.sidebar-item:hover{background:rgba(168,85,247,0.2);color:var(--purple-glow);transform:translateX(6px)}.sidebar-item i{width:24px}</style>`;
        document.body.insertAdjacentHTML('beforeend', sidebarHTML);

        const sidebarPanel = document.getElementById('sidebarPanel');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        function closeSidebar() { if(sidebarPanel) sidebarPanel.classList.remove('open'); if(sidebarOverlay) { sidebarOverlay.style.opacity = '0'; sidebarOverlay.style.visibility = 'hidden'; } }
        function openSidebar() { if(sidebarPanel) sidebarPanel.classList.add('open'); if(sidebarOverlay) { sidebarOverlay.style.opacity = '1'; sidebarOverlay.style.visibility = 'visible'; } }
        if(menuToggleBtn) menuToggleBtn.addEventListener('click', (e) => { e.stopPropagation(); openSidebar(); });
        if(sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
        document.querySelectorAll('.sidebar-item').forEach(item => { item.addEventListener('click', () => { const side = item.getAttribute('data-side'); if(side === 'reseller') window.location.href = 'ress.html'; if(side === 'dev') window.location.href = 'dev.html'; closeSidebar(); }); });
        document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeSidebar(); });
    </script>
</body>
</html>
