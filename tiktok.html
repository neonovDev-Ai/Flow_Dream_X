<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flow Dream X • TikTok Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-deep: #0a0a14;
            --bg-surface: #0d0e18;
            --bg-elevated: #13152a;
            --glass-bg: rgba(18, 20, 35, 0.75);
            --glass-stroke: rgba(168, 85, 247, 0.3);
            --purple-primary: #a855f7;
            --purple-glow: #c084fc;
            --teal-mystic: #2dd4bf;
            --text-light: #f3f0ff;
            --text-secondary: #c4c1d6;
            --text-dim: #8b86a3;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0a0a14 0%, #130b1e 50%, #0a0a14 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            pointer-events: none;
        }
        .orb-1 { width: 300px; height: 300px; background: #a855f7; top: -100px; left: -100px; animation: floatOrb 20s infinite; }
        .orb-2 { width: 400px; height: 400px; background: #2dd4bf; bottom: -150px; right: -150px; animation: floatOrb 25s infinite reverse; }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        .dashboard-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: var(--bg-surface);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            border: 1px solid var(--glass-stroke);
            z-index: 10;
        }

        @media (min-width: 768px) {
            .dashboard-wrapper {
                height: 90vh;
                border-radius: 48px;
                margin: 20px auto;
            }
        }

        .main-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .main-scroll::-webkit-scrollbar-track {
            background: rgba(168,85,247,0.1);
            border-radius: 10px;
        }
        .main-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #a855f7, #2dd4bf);
            border-radius: 10px;
        }

        .header {
            padding: 16px 20px;
            background: rgba(13, 14, 24, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-stroke);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: rgba(168,85,247,0.2);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            color: var(--purple-glow);
            font-size: 1.2rem;
            cursor: pointer;
        }
        .back-btn:active { transform: scale(0.95); }

        .header-title {
            flex: 1;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            background: var(--bg-elevated);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-stroke);
            color: var(--purple-glow);
            font-size: 1.1rem;
            cursor: pointer;
            position: relative;
        }
        .icon-btn:active { transform: scale(0.94); }

        .main-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 90px;
        }

        /* Card Styles */
        .glass-card {
            background: rgba(30, 30, 45, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid var(--glass-stroke);
            margin-bottom: 20px;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-box {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--glass-stroke);
            border-radius: 30px;
            padding: 14px 20px;
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--purple-primary);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--purple-primary), var(--teal-mystic));
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .action-btn:active { transform: scale(0.98); }
        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Progress Bar */
        .progress-wrapper {
            margin-top: 16px;
            display: none;
        }
        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--teal-mystic);
            transition: width 0.3s ease;
        }
        .progress-text {
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-dim);
            margin-top: 6px;
        }

        /* Result Section */
        .result-section {
            display: none;
        }
        .video-wrapper {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            margin-bottom: 16px;
        }
        .video-player {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
        }
        .meta-info {
            text-align: center;
            margin-bottom: 16px;
        }
        .meta-title {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .meta-author {
            font-size: 0.75rem;
            color: var(--teal-mystic);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-item {
            text-align: center;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 16px;
        }
        .stat-item i {
            color: var(--purple-glow);
            font-size: 1rem;
        }
        .dl-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .dl-btn {
            background: rgba(168,85,247,0.2);
            border: 1px solid var(--glass-stroke);
            padding: 12px;
            border-radius: 20px;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s;
        }
        .dl-btn:active { transform: scale(0.97); }
        .dl-btn i { font-size: 1.2rem; color: var(--teal-mystic); margin-bottom: 6px; }
        .dl-btn span { font-size: 0.75rem; color: var(--text-light); display: block; }
        .dl-btn small { font-size: 0.6rem; color: var(--text-dim); }

        .terminal-log {
            background: rgba(0,0,0,0.4);
            border-radius: 16px;
            padding: 12px;
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            height: 100px;
            overflow-y: auto;
            color: var(--teal-mystic);
            border: 1px solid var(--glass-stroke);
        }
        .log-line {
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 4px;
        }
        .log-error { color: #f87171; }
        .log-info { color: #8b86a3; }

        /* Bottom Navigation */
        .bottom-nav {
            flex-shrink: 0;
            background: rgba(13, 14, 24, 0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-stroke);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px;
            z-index: 30;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            border-radius: 30px;
            transition: all 0.2s;
            cursor: pointer;
            color: var(--text-dim);
            background: transparent;
            border: none;
            font-family: inherit;
        }
        .nav-item i { font-size: 1.1rem; }
        .nav-item span { font-size: 0.55rem; font-weight: 500; }
        .nav-item.active {
            background: rgba(168,85,247,0.2);
            color: var(--purple-glow);
        }
        .nav-item:active { transform: scale(0.95); }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(10,10,20,0.95);
            border: 1px solid var(--teal-mystic);
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            font-size: 0.75rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 150;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="dashboard-wrapper">
        <div class="header">
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
            <div class="header-title"><i class="fab fa-tiktok"></i> TikTok Downloader</div>
            <div class="header-actions">
                <div class="icon-btn" id="menuToggleBtn"><i class="fas fa-bars-staggered"></i></div>
            </div>
        </div>

        <div class="main-scroll">
            <div class="glass-card">
                <div class="input-group">
                    <input type="text" class="input-box" id="tiktokUrl" placeholder="Paste TikTok link...">
                </div>
                <button class="action-btn" id="downloadBtn" onclick="downloadTikTok()">
                    <i class="fab fa-tiktok"></i> Download Video
                </button>
                <div class="progress-wrapper" id="progressWrapper">
                    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                    <div class="progress-text" id="progressText">Memproses...</div>
                </div>
            </div>

            <div class="result-section" id="resultSection">
                <div class="glass-card">
                    <div class="video-wrapper">
                        <video class="video-player" id="videoPreview" controls loop playsinline></video>
                    </div>
                    <div class="meta-info">
                        <div class="meta-title" id="videoTitle">-</div>
                        <div class="meta-author" id="videoAuthor">@username</div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-item"><i class="fas fa-heart"></i><div id="likeCount">0</div></div>
                        <div class="stat-item"><i class="fas fa-comment"></i><div id="commentCount">0</div></div>
                        <div class="stat-item"><i class="fas fa-share"></i><div id="shareCount">0</div></div>
                    </div>
                    <div class="dl-grid">
                        <a href="#" class="dl-btn" id="dlVideo"><i class="fas fa-video"></i><span>Video No Watermark</span><small>MP4 HD</small></a>
                        <a href="#" class="dl-btn" id="dlAudio"><i class="fas fa-music"></i><span>Audio Only</span><small>MP3</small></a>
                    </div>
                </div>
            </div>

            <div class="terminal-log" id="logPanel">
                <div class="log-line">> TikTok Downloader Ready</div>
                <div class="log-line log-info">> Paste link TikTok di atas</div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-item" data-page="home"><i class="fas fa-home"></i><span>Home</span></button>
            <button class="nav-item" data-page="store"><i class="fas fa-store"></i><span>Store</span></button>
            <button class="nav-item" data-page="create"><i class="fas fa-magic"></i><span>Create</span></button>
            <button class="nav-item" data-page="other"><i class="fas fa-clock"></i><span>Other</span></button>
            <button class="nav-item" data-page="music"><i class="fas fa-music"></i><span>Music</span></button>
            <button class="nav-item active" data-page="tiktok"><i class="fab fa-tiktok"></i><span>TikTok</span></button>
            <button class="nav-item" data-page="suntik"><i class="fas fa-syringe"></i><span>Suntik</span></button>
            <button class="nav-item" data-page="profile"><i class="fas fa-user"></i><span>Profile</span></button>
        </div>
    </div>

    <div class="toast" id="toastMsg">Pesan</div>

    <script>
        const session = JSON.parse(localStorage.getItem('flowdream_session'));
        if(!session) window.location.href = 'index.html';

        function showToast(msg) {
            const toast = document.getElementById('toastMsg');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function addLog(msg, type = '') {
            const logPanel = document.getElementById('logPanel');
            const line = document.createElement('div');
            line.className = `log-line ${type === 'error' ? 'log-error' : type === 'info' ? 'log-info' : ''}`;
            line.innerHTML = `> ${msg}`;
            logPanel.appendChild(line);
            logPanel.scrollTop = logPanel.scrollHeight;
            if(logPanel.children.length > 20) logPanel.removeChild(logPanel.children[0]);
        }

        function setLoading(loading) {
            const btn = document.getElementById('downloadBtn');
            const progress = document.getElementById('progressWrapper');
            if(loading) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
                progress.style.display = 'block';
            } else {
                btn.disabled = false;
                btn.innerHTML = '<i class="fab fa-tiktok"></i> Download Video';
                progress.style.display = 'none';
            }
        }

        function updateProgress(pct, text) {
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressText').innerText = text;
        }

        function formatNumber(num) {
            if(num >= 1000000) return (num/1000000).toFixed(1) + 'M';
            if(num >= 1000) return (num/1000).toFixed(1) + 'K';
            return num;
        }

        async function downloadTikTok() {
            const url = document.getElementById('tiktokUrl').value.trim();
            if(!url) {
                showToast('Masukkan link TikTok!');
                return;
            }

            setLoading(true);
            document.getElementById('resultSection').style.display = 'none';
            updateProgress(10, 'Menganalisis link...');
            addLog(`Memproses: ${url.substring(0, 50)}...`, 'info');

            try {
                updateProgress(30, 'Menghubungi server...');
                
                // Menggunakan API tikwm.com
                const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                updateProgress(80, 'Memproses data...');

                if(data && data.data) {
                    const videoData = data.data;
                    
                    document.getElementById('videoTitle').innerText = videoData.title || 'No Title';
                    document.getElementById('videoAuthor').innerText = '@' + (videoData.author?.unique_id || 'unknown');
                    document.getElementById('likeCount').innerText = formatNumber(videoData.digg_count || 0);
                    document.getElementById('commentCount').innerText = formatNumber(videoData.comment_count || 0);
                    document.getElementById('shareCount').innerText = formatNumber(videoData.share_count || 0);
                    
                    const videoUrl = videoData.play || videoData.wmplay;
                    const audioUrl = videoData.music;
                    
                    document.getElementById('videoPreview').src = videoUrl;
                    
                    // Setup download buttons
                    const dlVideo = document.getElementById('dlVideo');
                    const dlAudio = document.getElementById('dlAudio');
                    
                    dlVideo.href = videoUrl;
                    dlVideo.onclick = (e) => { e.preventDefault(); window.open(videoUrl, '_blank'); showToast('Download dimulai...'); };
                    
                    if(audioUrl) {
                        dlAudio.href = audioUrl;
                        dlAudio.onclick = (e) => { e.preventDefault(); window.open(audioUrl, '_blank'); showToast('Download audio dimulai...'); };
                        dlAudio.style.display = 'flex';
                    } else {
                        dlAudio.style.display = 'none';
                    }
                    
                    document.getElementById('resultSection').style.display = 'block';
                    updateProgress(100, 'Selesai!');
                    addLog(`Berhasil! Video: ${videoData.title?.substring(0, 30)}...`);
                    showToast('Video berhasil diproses!');
                } else {
                    throw new Error('Gagal memproses video');
                }
            } catch(error) {
                addLog(`Error: ${error.message}`, 'error');
                showToast('Gagal memproses link. Coba lagi.');
                updateProgress(0, 'Gagal');
            } finally {
                setTimeout(() => setLoading(false), 500);
            }
        }

        function goBack() { window.location.href = 'home.html'; }

        const pageMap = {
            'home': 'home.html', 'store': 'store.html', 'create': 'create.html',
            'music': 'music.html', 'tiktok': 'tiktok.html', 'suntik': 'suntik.html', 'profile': 'profile.html'
        };

        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                const page = btn.getAttribute('data-page');
                if(page === 'other') { showToast('Coming Soon!'); return; }
                if(pageMap[page]) window.location.href = pageMap[page];
            });
        });

        // Sidebar injection
        const sidebarHTML = `
            <div class="sidebar-overlay" id="sidebarOverlay"></div>
            <aside class="sidebar" id="sidebarPanel">
                <div class="sidebar-banner">
                    <video autoplay muted loop playsinline><source src="banner.mp4" type="video/mp4"></video>
                    <div class="sidebar-logo"><i class="fas fa-dragon"></i></div>
                </div>
                <div class="sidebar-menu">
                    <div class="sidebar-item" data-side="reseller"><i class="fas fa-chart-line"></i> Reseller Page</div>
                    <div class="sidebar-item" data-side="dev"><i class="fas fa-code"></i> Dev Page</div>
                </div>
                <div style="padding: 16px; font-size:0.6rem; color:var(--text-dim); border-top:1px solid var(--glass-stroke);">
                    <i class="fas fa-crown"></i> Flow Dream X v3.0
                </div>
            </aside>
            <style>
                .sidebar-overlay {
                    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
                    z-index: 90; opacity: 0; visibility: hidden; transition: 0.3s;
                }
                .sidebar {
                    position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
                    background: linear-gradient(135deg, var(--bg-surface), #0a0a14);
                    border-right: 2px solid var(--purple-primary);
                    z-index: 100; transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
                    display: flex; flex-direction: column;
                }
                .sidebar.open { left: 0; }
                .sidebar-banner { height: 140px; position: relative; overflow: hidden; }
                .sidebar-banner video { width: 100%; height: 100%; object-fit: cover; }
                .sidebar-logo {
                    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                    width: 60px; height: 60px; background: linear-gradient(135deg, #a855f7, #2dd4bf);
                    border-radius: 50%; display: flex; align-items: center; justify-content: center;
                    border: 2px solid white;
                }
                .sidebar-logo i { font-size: 1.8rem; color: white; }
                .sidebar-menu { padding: 20px; flex: 1; }
                .sidebar-item {
                    display: flex; align-items: center; gap: 14px; padding: 12px 16px;
                    border-radius: 20px; color: var(--text-secondary); text-decoration: none;
                    margin: 8px 0; transition: all 0.3s; cursor: pointer;
                }
                .sidebar-item:hover { background: rgba(168,85,247,0.2); color: var(--purple-glow); transform: translateX(6px); }
                .sidebar-item i { width: 24px; }
            </style>
        `;
        document.body.insertAdjacentHTML('beforeend', sidebarHTML);

        const sidebarPanel = document.getElementById('sidebarPanel');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const menuToggleBtn = document.getElementById('menuToggleBtn');

        function closeSidebar() {
            if(sidebarPanel) sidebarPanel.classList.remove('open');
            if(sidebarOverlay) { sidebarOverlay.style.opacity = '0'; sidebarOverlay.style.visibility = 'hidden'; }
        }
        function openSidebar() {
            if(sidebarPanel) sidebarPanel.classList.add('open');
            if(sidebarOverlay) { sidebarOverlay.style.opacity = '1'; sidebarOverlay.style.visibility = 'visible'; }
        }
        if(menuToggleBtn) menuToggleBtn.addEventListener('click', (e) => { e.stopPropagation(); openSidebar(); });
        if(sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
        document.querySelectorAll('.sidebar-item').forEach(item => {
            item.addEventListener('click', () => {
                const side = item.getAttribute('data-side');
                if(side === 'reseller') window.location.href = 'ress.html';
                if(side === 'dev') window.location.href = 'dev.html';
                closeSidebar();
            });
        });
        document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeSidebar(); });
    </script>
</body>
</html>
